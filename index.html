<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Patella Rehab Log</title>
<meta name="description" content="Daily log, exercise cards and checkpoints for patella tendon repair rehab.">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#EEF2F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rehab Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout concept: a court-line scoreboard. Big day counter, a baseline timeline of the whole recovery, chalk-thin dividers, bottom tab bar for one-thumb use. */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --surface2:#E3EAE6; --ink:#142019; --muted:#566860; --line:#C9D4CE;
  --accent:#1F5FD6; --accent-ink:#FFFFFF; --accent-soft:#DCE7FA;
  --good:#1B7F4B; --good-soft:#D9F0E3; --warn:#9A5F0B; --warn-soft:#F8E8C8; --bad:#B3302F; --bad-soft:#F7DADA;
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512; --surface:#16201C; --surface2:#1F2C27; --ink:#E7EFEA; --muted:#98AAA0; --line:#2C3B35;
    --accent:#6EA2FF; --accent-ink:#0B1220; --accent-soft:#1A2B4A;
    --good:#4CC38A; --good-soft:#143324; --warn:#E3AC52; --warn-soft:#3A2B10; --bad:#F07F7F; --bad-soft:#3F1B1B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#16201C; --surface2:#1F2C27; --ink:#E7EFEA; --muted:#98AAA0; --line:#2C3B35;
  --accent:#6EA2FF; --accent-ink:#0B1220; --accent-soft:#1A2B4A;
  --good:#4CC38A; --good-soft:#143324; --warn:#E3AC52; --warn-soft:#3A2B10; --bad:#F07F7F; --bad-soft:#3F1B1B;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
.shell{max-width:560px;margin:0 auto}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{padding-block:18px 6px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.eyebrow{font:600 11px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chip{font:500 12px/1 var(--f-body);padding:6px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.dayline{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:10px}
.day{font:700 60px/0.85 var(--f-display);letter-spacing:.01em;white-space:nowrap;flex:0 0 auto}
.day small{font:600 18px var(--f-display);color:var(--muted);margin-left:6px;letter-spacing:.02em}
.phase-name{font:600 15px var(--f-body);text-align:right}
.phase-name span{display:block;color:var(--muted);font-weight:400;font-size:13px}
.tl{position:relative;display:flex;gap:2px;height:12px;margin-top:16px}
.tl .seg{position:relative;background:var(--surface2);border-radius:2px;overflow:hidden;min-width:6px}
.tl .seg i{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.9}
.tl .seg b{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.tl-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
main{display:grid;gap:12px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card.flat{background:transparent;border-style:dashed}
h2{font:700 24px/1.1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
h3{font:600 16px/1.25 var(--f-body)}
.meta{color:var(--muted);font-size:13px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{min-height:36px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar .lbl{font:600 15px var(--f-body);text-align:center;flex:1}
.fieldlabel{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:14px;margin-bottom:6px}
.fieldlabel output{font:700 22px var(--f-display);min-width:32px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:32px;margin:0}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.segbtn{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.segbtn button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:14px}
.segbtn button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
textarea,input[type=text],input[type=number]{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font-size:15px}
textarea{min-height:76px;resize:vertical}
.field{display:grid;gap:4px}
.ex-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.counter{display:flex;align-items:center;gap:6px;flex-shrink:0}
.counter button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:600 22px/1 var(--f-body);cursor:pointer}
.counter .count{min-width:52px;text-align:center;font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.counter .count small{font-size:15px;color:var(--muted)}
.bar{height:6px;background:var(--surface2);border-radius:4px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.full i{background:var(--good)}
.donetag{font-size:12px;font-weight:600;color:var(--good);margin-top:6px}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--accent);min-height:32px;display:flex;align-items:center}
.why{display:grid;gap:10px;margin-top:6px;font-size:14px}
.why dt{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.why dd{margin:2px 0 0}
.why .stop dd{color:var(--bad)}
.lock{opacity:.97}
.pill{display:inline-block;font:600 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.list{margin:6px 0 0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.kv{display:grid;gap:2px}
.brace{display:grid;gap:8px;margin-top:8px}
.brace .b{padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px}
.brace .b.now{border-color:var(--accent);background:var(--accent-soft)}
.brace .b strong{display:block}
.phase{display:grid;grid-template-columns:36px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.phase:first-of-type{border-top:0}
.phase .n{font:700 28px/1 var(--f-display);color:var(--muted)}
.phase.now .n{color:var(--accent)}
.cp-item{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.cp-item:first-of-type{border-top:0}
.cp-input{display:flex;gap:8px;align-items:center}
.cp-input input{max-width:110px}
.gate{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface2);font-size:13px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.chart .ln{stroke:var(--line);stroke-width:1}
.chart .pl{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dt{fill:var(--accent)}
.chart .dtl{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.chart text.val{fill:var(--ink);font:700 13px var(--f-body)}
.adh{display:flex;align-items:flex-end;gap:4px;height:84px;margin-top:8px}
.adh div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.adh i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.adh i.none{background:var(--surface2)}
.adh span{font-size:10px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.swl{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:8px}
.swl div{text-align:center;padding:6px 0;border-radius:6px;font:600 12px var(--f-body);background:var(--surface2);color:var(--muted)}
.swl .l{background:var(--good-soft);color:var(--good)}
.swl .m{background:var(--warn-soft);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:10px;border-radius:10px;background:var(--surface2)}
.stat b{display:block;font:700 28px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabs button{min-height:48px;border:0;background:transparent;border-radius:10px;cursor:pointer;font:600 12px var(--f-body);letter-spacing:.04em;color:var(--muted)}
.tabs button[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
.sheet{position:fixed;inset:0;background:rgba(8,14,11,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .panel{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
@media (prefers-reduced-motion:no-preference){.bar i,.adh i{transition:height .2s,width .2s}}
</style>
</head>
<body>
<div class="shell">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="/app.js"></script>
</body>
</html>
